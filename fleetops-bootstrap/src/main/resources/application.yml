spring:
  application:
    name: fleetops-enterprise-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/fleetops}
    username: ${DB_USERNAME:fleetops}
    password: ${DB_PASSWORD:fleetops_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:fleetops}
    password: ${RABBITMQ_PASSWORD:fleetops_dev}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

fleetops:
  integration:
    outbox:
      publisher:
        enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
        batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:25}
        fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:1000}
        confirm-timeout-ms: ${OUTBOX_PUBLISHER_CONFIRM_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
