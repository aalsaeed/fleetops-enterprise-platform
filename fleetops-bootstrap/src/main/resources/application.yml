spring:
  application:
    name: fleetops-enterprise-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/fleetops}
    username: ${DB_USERNAME:fleetops}
    password: ${DB_PASSWORD:fleetops_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:fleetops}
    password: ${RABBITMQ_PASSWORD:fleetops_dev}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SECURITY_JWT_ISSUER_URI:http://127.0.0.1:8180/realms/fleetops}
          jwk-set-uri: ${SECURITY_JWK_SET_URI:http://127.0.0.1:8180/realms/fleetops/protocol/openid-connect/certs}

fleetops:
  integration:
    operations:
      failure-limit: ${INTEGRATION_OPERATIONS_FAILURE_LIMIT:20}
    outbox:
      publisher:
        enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
        batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:25}
        fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:1000}
        confirm-timeout-ms: ${OUTBOX_PUBLISHER_CONFIRM_TIMEOUT_MS:5000}
        max-attempts: ${OUTBOX_PUBLISHER_MAX_ATTEMPTS:5}
        retry-initial-delay-ms: ${OUTBOX_PUBLISHER_RETRY_INITIAL_DELAY_MS:1000}
        retry-max-delay-ms: ${OUTBOX_PUBLISHER_RETRY_MAX_DELAY_MS:60000}
        stale-publishing-timeout-ms: ${OUTBOX_STALE_PUBLISHING_TIMEOUT_MS:60000}
    inbox:
      consumer:
        enabled: ${INBOX_CONSUMER_ENABLED:true}
        retry:
          max-attempts: ${INBOX_CONSUMER_RETRY_MAX_ATTEMPTS:3}
          initial-interval-ms: ${INBOX_CONSUMER_RETRY_INITIAL_INTERVAL_MS:250}
          multiplier: ${INBOX_CONSUMER_RETRY_MULTIPLIER:2.0}
          max-interval-ms: ${INBOX_CONSUMER_RETRY_MAX_INTERVAL_MS:2000}
      processor:
        enabled: ${INBOX_PROCESSOR_ENABLED:true}
        batch-size: ${INBOX_PROCESSOR_BATCH_SIZE:25}
        fixed-delay-ms: ${INBOX_PROCESSOR_FIXED_DELAY_MS:1000}
        stale-processing-timeout-ms: ${INBOX_PROCESSOR_STALE_TIMEOUT_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
