spring:
  application:
    name: fleetops-enterprise-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/fleetops}
    username: ${DB_USERNAME:fleetops}
    password: ${DB_PASSWORD:fleetops_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
