# Keep background integration workers disabled by default during Spring Boot tests.
# Individual tests opt in when they exercise a worker explicitly.
fleetops.integration.outbox.publisher.enabled=false
fleetops.integration.inbox.consumer.enabled=false
fleetops.integration.inbox.processor.enabled=false

# Existing integration tests focus on their business capability. Security-specific tests
# explicitly disable this flag and exercise the production authorization chain.
fleetops.security.test-permit-all=true
