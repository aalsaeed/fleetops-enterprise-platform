global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fleetops
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          application: fleetops-enterprise-platform
    oauth2:
      client_id: fleetops-operator-client
      client_secret: fleetops-local-operator-secret
      token_url: http://keycloak:8080/realms/fleetops/protocol/openid-connect/token
