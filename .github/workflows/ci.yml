name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, feature/project-foundation]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn --batch-mode --update-snapshots verify

      - name: Build OCI image
        run: docker build --tag fleetops-enterprise-platform:ci .

      - name: Verify non-root runtime user
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' fleetops-enterprise-platform:ci)" = "10001:10001"

      - name: Validate Compose application profile
        run: docker compose --profile application config >/dev/null

      - name: Smoke test containerized application
        env:
          FLEETOPS_IMAGE: fleetops-enterprise-platform:ci
        run: |
          set -euo pipefail

          cleanup() {
            docker compose --profile application down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose --profile application up --detach --no-build

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness | grep --quiet '"status":"UP"'; then
              echo "FleetOps readiness probe is UP"
              exit 0
            fi
            sleep 2
          done

          docker compose --profile application ps
          docker compose --profile application logs fleetops postgres rabbitmq keycloak
          exit 1
