services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetops}
      POSTGRES_USER: ${POSTGRES_USER:-fleetops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetops_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fleetops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetops} -d ${POSTGRES_DB:-fleetops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fleetops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fleetops_dev}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fleetops_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-fleetops_local_admin}
      KC_HOSTNAME: "http://127.0.0.1:${KEYCLOAK_PORT:-8180}"
      FLEETOPS_USER_CLIENT_SECRET: ${FLEETOPS_USER_CLIENT_SECRET:-fleetops-local-user-secret}
      FLEETOPS_OPERATOR_CLIENT_SECRET: ${FLEETOPS_OPERATOR_CLIENT_SECRET:-fleetops-local-operator-secret}
      FLEETOPS_ADMIN_CLIENT_SECRET: ${FLEETOPS_ADMIN_CLIENT_SECRET:-fleetops-local-admin-secret}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/fleetops-realm.json:/opt/keycloak/data/import/fleetops-realm.json:ro

  fleetops:
    profiles: ["application"]
    build:
      context: .
    image: ${FLEETOPS_IMAGE:-fleetops-enterprise-platform:local}
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fleetops}
      DB_USERNAME: ${POSTGRES_USER:-fleetops}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fleetops_dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-fleetops}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-fleetops_dev}
      SECURITY_JWT_ISSUER_URI: ${SECURITY_JWT_ISSUER_URI:-http://127.0.0.1:8180/realms/fleetops}
      SECURITY_JWK_SET_URI: http://keycloak:8080/realms/fleetops/protocol/openid-connect/certs
      OTEL_TRACES_EXPORTER_ENABLED: ${OTEL_TRACES_EXPORTER_ENABLED:-false}
      OTEL_TRACES_SAMPLING_PROBABILITY: ${OTEL_TRACES_SAMPLING_PROBABILITY:-0.1}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${FLEETOPS_CONTAINER_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      OBSERVABILITY_INTEGRATION_SNAPSHOT_TTL_MS: ${OBSERVABILITY_INTEGRATION_SNAPSHOT_TTL_MS:-5000}
      SERVER_PORT: 8080
    ports:
      - "${FLEETOPS_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 20s

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    profiles: ["observability"]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"

  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: ["observability"]
    depends_on:
      - keycloak
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - fleetops_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-fleetops_local_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - fleetops_grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  fleetops_postgres_data:
  fleetops_redis_data:
  fleetops_prometheus_data:
  fleetops_grafana_data:
